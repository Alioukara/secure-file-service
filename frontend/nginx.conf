server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed by the build, so the name changes whenever the content does. Safe
    # to keep forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is NOT hashed: it is what points at the current bundle. Cached,
    # it would keep sending browsers to a build that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single page application: any unknown path is handled by the front, not by
    # nginx, otherwise a refresh on a deep link would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
