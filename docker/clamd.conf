# Based on the file shipped by clamav/clamav:1.5.4, read from the image itself.
# The five lines below are ITS defaults and must stay: the entrypoint and
# clamdcheck.sh both look for the local socket, and dropping it leaves the
# container running but forever unhealthy.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Everything below is ours.

# THE non negotiable line of this file.
#
# Disabled by default. Without it, a file larger than MaxFileSize or MaxScanSize
# is NOT analysed and clamd still answers OK. The service would write CLEAN and
# serve a file that was never scanned, while respecting its own == CLEAN test.
# This turns that silent fail-open into a Heuristics.Limits.Exceeded verdict.
AlertExceedsMax yes

# Matches the ceiling the service declares. Past it, clamd stops analysing.
MaxFileSize 100M

# Archives expand: this is the cumulative budget, kept at the image default.
MaxScanSize 400M

# Deliberately ABOVE MaxFileSize. Were it equal or below, an oversized file
# would be cut at transport level ("INSTREAM size limit exceeded"), which says
# nothing about why. Above it, the file arrives whole and clamd returns a real
# Heuristics.Limits.Exceeded verdict.
StreamMaxLength 110M

# The service caps itself at 8 concurrent scans, one below this.
MaxThreads 10
